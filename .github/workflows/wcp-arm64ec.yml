# Builds an ARM64EC (system32) + x86 (syswow64) package in the .wcp format
# that Winlator-style launchers (Bannerlator, GameNative) install as a VKD3D
# component. Recipe adapted from The412Banner/Nightlies.
name: WCP (ARM64EC)

on:
  workflow_dispatch:
    inputs:
      descriptor_qa:
        description: 'Build with -Denable_descriptor_qa=true'
        type: boolean
        default: false
      label:
        description: 'Suffix for the package version name'
        type: string
        default: 'mali'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git zip build-essential \
            python3 pkg-config zstd meson ninja-build wget unzip

      - name: Setup glslang
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> $GITHUB_PATH

      - name: Setup llvm-mingw
        run: |
          TAG=20251104
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$TAG/llvm-mingw-$TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -C /opt/llvm-mingw --strip-components=1 -xJf llvm.tar.xz
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          for arch in arm64ec:aarch64:aarch64 i686:x86:i686; do
            IFS=: read -r prefix family cpu <<< "$arch"
            cat > cross-$prefix.txt <<EOF
          [binaries]
          c = '$prefix-w64-mingw32-clang'
          cpp = '$prefix-w64-mingw32-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          windres = '$prefix-w64-mingw32-windres'
          widl = '$prefix-w64-mingw32-widl'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'windows'
          cpu_family = '$family'
          cpu = '$cpu'
          endian = 'little'
          EOF
            meson setup build-$prefix --cross-file cross-$prefix.txt \
              -Dbuildtype=release -Dstrip=true \
              -Denable_descriptor_qa=${{ inputs.descriptor_qa }}
            ninja -C build-$prefix
          done

      - name: Package
        run: |
          VERSION="arm64ec-$(git describe --tags --abbrev=0 | sed 's/^v//')-${{ inputs.label }}-$(git rev-parse --short HEAD)"
          if [ "${{ inputs.descriptor_qa }}" = "true" ]; then VERSION="$VERSION-qa"; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p pkg/system32 pkg/syswow64
          for dll in d3d12 d3d12core; do
            find build-arm64ec -name "$dll.dll" -exec cp -L {} pkg/system32/ \;
            find build-i686 -name "$dll.dll" -exec cp -L {} pkg/syswow64/ \;
          done
          llvm-strip --strip-all pkg/system32/*.dll pkg/syswow64/*.dll
          cat > pkg/profile.json <<EOF
          {
            "type": "VKD3D",
            "versionName": "$VERSION",
            "versionCode": 1,
            "description": "YuutaTsubasa/vkd3d-proton $(git rev-parse --short HEAD)",
            "files": [
              {"source": "system32/d3d12.dll", "target": "\${system32}/d3d12.dll"},
              {"source": "system32/d3d12core.dll", "target": "\${system32}/d3d12core.dll"},
              {"source": "syswow64/d3d12.dll", "target": "\${syswow64}/d3d12.dll"},
              {"source": "syswow64/d3d12core.dll", "target": "\${syswow64}/d3d12core.dll"}
            ]
          }
          EOF
          cd pkg && tar --zstd -cf "../VKD3D-Proton-$VERSION.wcp" *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION }}
          path: '*.wcp'
